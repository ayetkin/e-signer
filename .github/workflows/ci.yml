name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  # The release workflow runs the same tests before it publishes.
  workflow_call:

# A newer push to the same branch or pull request makes the running check pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Headless screenshot rendering (ScreenshotTest) needs OpenGL and fonts.
      - name: Install rendering libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fontconfig fonts-inter fonts-dejavu-core libgl1 libglx-mesa0
      - name: Test
        run: ./gradlew --no-daemon :core:test :app:test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots
          if-no-files-found: ignore
